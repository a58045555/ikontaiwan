name: Game regression checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'hanno/**'
      - 'preview-v2/**'
      - 'validation/**'
      - '.github/workflows/preview-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'hanno/**'
      - 'preview-v2/**'
      - 'validation/**'
      - '.github/workflows/preview-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check mechanics, saves, pupils, stories and settings
        run: node validation/run-preview-checks.cjs
      - name: Check production release and preview save compatibility
        run: node validation/verify-release.cjs
      - name: Check reaction kumite and next-level progression
        run: node validation/verify-hanno.cjs
      - name: Check compact records and visible character setup
        run: node validation/verify-compact.cjs

      - name: Check automatic points and legacy save replay
        run: node validation/verify-autopoints.cjs

      - name: Check scheduled training, trial age and save preservation
        run: node validation/verify-playflow.cjs

      - name: Check optional training plans and decision clarity
        run: node validation/verify-pacing.cjs

      - name: Check first-battle tutorial timing and button contrast
        run: node validation/verify-review.cjs
