<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17120f">
<meta name="description" content="極真人生小遊戲試玩：側面視角的自由組手，跟凱師範有來有往地攻防。">
<style>*{box-sizing:border-box}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>自由組手｜極真人生小遊戲（試玩版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: one-column phone game — header, score strip with rally counter, side-view pixel stage, attack row over defence row. Single dark dojo look. */
:root{
  --bg:#17120f; --panel:#231b15; --line:#3b2f25; --fg:#f2e9dd; --muted:#a89684;
  --accent:#e6ac4c; --hit:#d9483b; --atk:#c9683f;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.app{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.06em;line-height:1.1}
.switch{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:6px 8px 6px 14px;font:700 14px var(--f-body);cursor:pointer;flex-shrink:0}
.switch .knob{width:42px;height:24px;border-radius:999px;background:#4a3d33;position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch[aria-checked="true"] .knob{background:var(--accent)}
.switch[aria-checked="true"] .knob::after{transform:translateX(18px);background:#2a1d10}
.switch:focus-visible,.pad:focus-visible,.cta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.side.r{align-items:flex-end;text-align:right}
.side b{color:var(--fg);font-size:15px}
.pips{display:flex;gap:4px}
.pips i{width:16px;height:6px;border-radius:2px;background:#3d3129}
.pips i.on{background:var(--accent)}
.side.r .pips i.on{background:var(--hit)}
.rally{text-align:center;line-height:1.1}
.rally b{display:block;font:900 26px var(--f-display);color:var(--fg)}
.rally span{font-size:11px;color:var(--muted);letter-spacing:.1em}
.rally.hot b{color:var(--accent)}
.stage{position:relative;width:100%;aspect-ratio:150/112;touch-action:manipulation;user-select:none;-webkit-user-select:none;max-width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:#000}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#stamp{position:absolute;top:10%;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;white-space:nowrap;font-weight:900;text-align:center}
#stamp small{display:block;font:700 .32em var(--f-body);letter-spacing:.1em;-webkit-text-stroke:0;text-shadow:0 2px 0 #000;color:var(--accent)}
#stamp.plain{opacity:1;font:700 clamp(15px,4.4vw,20px) var(--f-body);color:var(--fg);background:rgba(0,0,0,.6);padding:2px 10px;border-radius:4px}
#stamp.plain small{display:inline;font-size:1em;margin-left:6px;text-shadow:none}
#stamp.pop{font-family:var(--f-display);font-size:clamp(36px,12vw,66px);color:#fff;-webkit-text-stroke:2px var(--hit);text-shadow:0 4px 0 #7a1d14;animation:pop .8s forwards}
#stamp.pop.hurt{color:var(--hit);-webkit-text-stroke:2px #fff;text-shadow:0 4px 0 #000;font-size:clamp(28px,9vw,50px)}
@media (max-width:420px){.overlay{gap:8px;padding:10px}.overlay h2{font-size:22px}.overlay p{font-size:12px;line-height:1.5}.cta{padding:8px 18px;font-size:14px}}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(2.3) rotate(-9deg)}12%{opacity:1;transform:translateX(-50%) scale(.9) rotate(-4deg)}22%{transform:translateX(-50%) scale(1.06) rotate(-4deg)}32%{transform:translateX(-50%) scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-12%) rotate(-4deg)}}
#cue{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:clamp(12px,3.4vw,14px);font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.8));color:var(--fg);text-align:center;pointer-events:none;min-height:1.4em}
#cue.open{color:#ffe08a}
#cue.danger{color:#ffb4a8}
.overlay{overflow-y:auto;justify-content:safe center;}
.stage:has(> .overlay:not([hidden])){aspect-ratio:auto;min-height:min(380px,92vw)}
.stage:has(> .overlay:not([hidden])) canvas{position:absolute;inset:0}
.belts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;max-width:400px}
.belt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:6px;border:1px solid var(--line);background:rgba(35,27,21,.9);color:var(--fg);font:700 13px var(--f-body);cursor:pointer}
.belt i{display:block;width:70%;height:6px;border-radius:2px;border:1px solid rgba(0,0,0,.5)}
.belt small{font-size:10px;color:var(--muted);font-weight:500;min-height:1.2em}
.belt.done small{color:#8fc4b0}
.belt:focus-visible{outline:2px solid var(--accent)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;background:rgba(15,10,7,.82)}
.overlay h2{margin:0;font-family:var(--f-display);font-size:clamp(22px,7vw,32px);letter-spacing:.08em}
.overlay p{margin:0;max-width:31em;font-size:clamp(12px,3.4vw,14px);line-height:1.6;color:#d8cbbb;text-wrap:balance}
.overlay .stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.overlay .stats div{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.overlay .stats b{font-size:clamp(18px,5.5vw,24px);color:var(--fg)}
.diffs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.cta.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}.cta.diff{padding:10px 16px}
.lesson{background:var(--panel);border:1px solid var(--line);border-left:4px solid #6f9c8c;border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.lesson .lh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lesson b{font:900 17px var(--f-display);letter-spacing:.04em}
.lesson #lDots{letter-spacing:3px;color:#8fc4b0;font-size:13px}
.lesson p{grid-column:1/-1;margin:0;font-size:14px;line-height:1.6;color:#d8cbbb}
.lskip{grid-column:2;grid-row:1;background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;font:12px var(--f-body);padding:3px 8px;cursor:pointer}
.overlay .sub{font-size:12px;color:var(--muted)}
.pad.hint{border-color:var(--accent)!important;animation:hintp .5s ease-in-out infinite alternate}
@keyframes hintp{from{background:#24302b}to{background:#5a4522}}
.ctl.tutorial .atk{opacity:.22!important;pointer-events:none}
.cta{font:900 16px var(--f-body);letter-spacing:.1em;background:var(--accent);color:#2a1d10;border:0;border-radius:6px;padding:10px 26px;cursor:pointer}
.ctl{display:grid;grid-template-columns:1fr 28px 1fr;gap:0 6px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mid{display:flex;flex-direction:column;gap:8px}
.mid span{flex:1;display:flex;align-items:center;justify-content:center;font:900 15px var(--f-display);color:var(--muted)}
.mid span:first-child,.colh{flex:0 0 16px}
.colh{font-size:12px;letter-spacing:.14em;color:var(--muted);text-align:center}
.pad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:64px;background:var(--panel);border:1px solid var(--line);border-bottom:4px solid #120d0a;border-radius:10px;color:var(--fg);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--f-body);transition:opacity .1s,background .1s}
.pad b{font-size:17px;font-weight:900;letter-spacing:.04em}
.pad small{font-size:11px;color:var(--muted)}
.pad.def{border-left:4px solid #6f9c8c}
.pad.atk{border-right:4px solid var(--atk)}
.pad:active,.pad.on{transform:translateY(2px);border-bottom-width:2px;background:#3a2c21}
.pad.good{background:#3f3420;border-color:var(--accent)}
.pad.bad{background:#3e2220;border-color:var(--hit)}
.ctl[data-mode="defend"] .def{background:#24302b;border-color:#6f9c8c}
.ctl[data-mode="busy"] .pad{opacity:.38}.ctl[data-mode="defend"] .atk{opacity:.7}
.ctl[data-mode="attack"] .def{opacity:.55}
.ctl[data-mode="open"] .atk{background:#4a3520;border-color:var(--accent);box-shadow:0 0 16px rgba(230,172,76,.4)}
.ctl[data-mode="open"] .def{opacity:.45}
@media (max-width:380px){.pad b{font-size:15px}.pad{min-height:58px}}
#cue{z-index:2}
.overlay{z-index:3}
.nm{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.nm span{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:3px;background:#3d3129;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--accent);transition:width .25s ease-out,background .2s}
.bar.r i{inset:0 0 0 auto;background:#cf7a4a}
.bar i.low{background:var(--hit)!important}
.stam{display:flex;align-items:center;gap:6px;align-self:stretch}.stam span{font-size:11px;color:var(--muted)}.sbar{flex:1;height:5px;border-radius:2px;background:#3d3129;overflow:hidden;position:relative}.sbar i{position:absolute;inset:0 auto 0 0;width:100%;background:#8fc4b0;transition:width .12s}.sbar i.low{background:var(--hit)}
.score .side{min-width:0}.side .bar,.side .nm{align-self:stretch}
@media (max-width:380px){.pad b{font-size:15px}.pad{min-height:62px}}
.note.ig a{color:var(--accent)}
.note{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
@media (max-width:380px){.pad{gap:5px}.pad b{font-size:14px}}
</style>

</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="eyebrow">極真人生 · 小遊戲試做 · 側面視角</p>
      <h1>自由組手</h1>
    </div>
    <button class="switch" id="fx" role="switch" aria-checked="true" aria-label="特效開關">特效 <span id="fxTxt">開</span><span class="knob"></span></button>
  </header>

  <div class="score">
    <div class="side"><div class="nm"><b>你</b><span id="pHpT">100</span></div><div class="bar"><i id="pHp"></i></div><div class="stam"><span>氣</span><div class="sbar"><i id="pSt"></i></div></div></div>
    <div class="rally" id="rallyBox"><b id="rally">0</b><span>來回</span></div>
    <div class="side r"><div class="nm"><span id="oHpT">100</span><b>凱師範</b></div><div class="bar r"><i id="oHp"></i></div></div>
  </div>

  <div class="lesson" id="lesson" hidden><div class="lh"><b id="lTitle"></b><span id="lDots"></span></div><p id="lText"></p><button class="lskip" id="lQuit">離開教學</button></div>
  <div class="stage">
    <canvas id="cv" width="150" height="112"></canvas>
    <div id="stamp"></div>
    <div id="cue"></div>
    <div class="overlay" id="menu">
      <h2>押忍！</h2>
      <p>跟師範有來有往：擋下他的招就有空檔打回去，被擋就換你接。第一次玩先上教學。</p>
      <div class="diffs"><button class="cta" id="tutBtn">防守教學</button><button class="cta" id="tutAtkBtn">攻擊教學</button></div>
      <p class="sub">選擇對練等級：</p>
      <div class="belts" id="belts" role="group" aria-label="選擇等級"></div>
    </div>
    <div class="overlay" id="tutDone" hidden>
      <h2 id="tdTitle">教學完成</h2>
      <p id="tdText"></p>
      <div class="diffs"><button class="cta diff" data-d="0">白帶實戰</button><button class="cta ghost" id="tutToMenu">選等級</button><button class="cta ghost" id="tutAgain">再練一次</button></div>
    </div>
    <div class="overlay" id="result" hidden>
      <h2 id="rTitle">結束</h2>
      <div class="stats">
        <div><b id="rScore">0</b>剩餘體力</div>
        <div><b id="rBest">0</b>最長來回</div>
        <div><b id="rAvg">–</b>平均反應</div>
      </div>
      <p>把右上角的特效關掉再打一場，比較看看差別。</p>
      <div class="diffs"><button class="cta" id="nextLv" hidden>挑戰下一級</button><button class="cta ghost" id="again">再打一場</button><button class="cta ghost" id="toMenu">選等級</button></div>
    </div>
  </div>

  
    <div class="ctl" id="pads" data-mode="attack">
      <div class="col def-col">
        <span class="colh">防守</span>
        <button class="pad def" data-a="def" data-l="high"><b>上防守</b><small>雙手護頭</small></button>
        <button class="pad def" data-a="def" data-l="mid"><b>中防守</b><small>手肘護腹</small></button>
        <button class="pad def" data-a="def" data-l="low"><b>下防守</b><small>抬膝擋</small></button>
      </div>
      <div class="mid"><span></span><span>頭</span><span>腹</span><span>腿</span></div>
      <div class="col atk-col">
        <span class="colh">出手</span>
        <button class="pad atk" data-a="atk" data-l="high"><b>上段踢</b><small>傷害大</small></button>
        <button class="pad atk" data-a="atk" data-l="mid"><b>中段拳</b><small>最快</small></button>
        <button class="pad atk" data-a="atk" data-l="low"><b>下段踢</b><small>穩定</small></button>
      </div>
  </div>
  <p class="note">試玩版，人物先用程式畫的像素人代替，之後會換成正式的圖。左手防守、右手出手，同一列就是同一個高度；電腦可用鍵盤 A／S／D 出手，↑／←／↓ 防守。</p>
  <p class="note ig">想體驗真正的組手？歡迎來道場：<a href="https://www.instagram.com/i.k.o.n.taiwan/" target="_blank" rel="noopener">IG @i.k.o.n.taiwan</a></p>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const GROUND=106,BY=76,OFFY=20,CAMX=25,CAMY=14;
const OUT='#1b1410',GI='#ecebe6',GI_S='#b9b3a8';

/* ---------- settings ---------- */
let FX=true;
try{if(localStorage.getItem('fk_fx')==='0')FX=false}catch(e){}
const fxBtn=document.getElementById('fx'),fxTxt=document.getElementById('fxTxt');
function syncFx(){fxBtn.setAttribute('aria-checked',FX);fxTxt.textContent=FX?'開':'關'}
syncFx();
fxBtn.addEventListener('click',()=>{FX=!FX;syncFx();try{localStorage.setItem('fk_fx',FX?'1':'0')}catch(e){}});
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- background ---------- */
const bg=document.createElement('canvas');bg.width=208;bg.height=128;
(function(){
  const g=bg.getContext('2d'),R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
  R(0,0,208,128,'#3a2a1e');
  for(let x=0;x<208;x+=26){R(x,0,1,98,'#2f2218');R(x+1,0,1,98,'#45331f')}
  R(0,12,208,4,'#24180f');R(0,16,208,1,'#4d3a26');
  [[8,24],[160,24]].forEach(([x,y])=>{R(x-1,y-1,38,40,'#1f150e');R(x,y,36,38,'#7c6a4c');
    for(let i=1;i<4;i++)R(x+i*9,y,1,38,'#4a3a26');for(let j=1;j<4;j++)R(x,y+j*9.5|0,36,1,'#4a3a26');R(x+2,y+2,6,4,'#9a8661')});
  R(95,18,18,2,'#1a110b');R(96,20,16,40,'#d9cbb0');R(95,60,18,2,'#1a110b');R(103,16,2,2,'#1a110b');
  [[100,25,8,2],[103,24,2,10],[99,30,10,1],[101,33,6,1],[100,38,8,2],[104,40,1,8],[100,44,3,1],[105,44,3,1],[101,49,6,1],[103,51,2,5]].forEach(a=>R(a[0],a[1],a[2],a[3],'#241a12'));
  R(98,54,3,3,'#a8332a');
  R(0,98,208,30,'#8a5d36');
  for(let y=98,k=0;y<128;y+=4,k++){R(0,y,208,1,'#6c4627');for(let x=(k%2)*23;x<208;x+=46)R(x,y,1,4,'#6c4627')}
  R(0,98,208,2,'#a87447');
  const gr=g.createLinearGradient(0,98,0,128);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');g.fillStyle=gr;g.fillRect(0,98,208,30);
})();

/* ---------- poses (facing right; hip at origin, feet at y=30) ---------- */
const S={ox:0,hip:[0,0],neck:[2,-21],head:[3,-27],fE:[8,-13],fH:[13,-20],bE:[-2,-12],bH:[6,-17],fK:[7,13],fF:[11,30],bK:[-5,14],bF:[-11,30]};
const mk=o=>Object.assign({},S,o);
const P={
  stance:S,
  chHigh:mk({ox:2,hip:[-1,-1],neck:[-1,-22],head:[-1,-28],fK:[10,-5],fF:[3,10],bK:[-4,14],bF:[-8,30],fE:[6,-14],fH:[11,-21],bE:[-5,-12],bH:[2,-17]}),
  stHigh:mk({ox:14,hip:[-2,-1],neck:[-7,-20],head:[-9,-25],fK:[10,-12],fF:[24,-25],bK:[-3,14],bF:[-6,30],fE:[2,-15],fH:[7,-22],bE:[-8,-10],bH:[-12,-4]}),
  chMid:mk({neck:[-1,-21],head:[0,-27],bE:[-10,-10],bH:[-5,-5],bK:[-6,14],bF:[-12,30]}),
  stMid:mk({ox:14,hip:[2,0],neck:[6,-21],head:[8,-27],bE:[9,-15],bH:[21,-14],fE:[3,-11],fH:[2,-17],fK:[8,13],fF:[13,30],bK:[-4,14],bF:[-11,30]}),
  chLow:mk({ox:2,hip:[0,1],neck:[0,-20],head:[1,-26],fK:[10,7],fF:[3,21],bK:[-5,15],bF:[-10,30]}),
  stLow:mk({ox:14,hip:[0,1],neck:[-3,-20],head:[-4,-26],fK:[11,10],fF:[22,24],bK:[-4,15],bF:[-8,30],fE:[4,-13],fH:[9,-20],bE:[-7,-10],bH:[-10,-4]}),
  blHigh:mk({neck:[1,-21],head:[1,-27],fE:[7,-21],fH:[8,-31]}),
  blMid:mk({hip:[0,1],neck:[2,-20],head:[2,-26],fE:[6,-8],fH:[10,-17],bE:[0,-12],bH:[7,-18]}),
  blLow:mk({hip:[0,-1],neck:[1,-22],head:[1,-28],fK:[11,4],fF:[13,19],bK:[-5,13],bF:[-10,30]}),
  hitHigh:mk({ox:-5,hip:[-2,0],neck:[-6,-20],head:[-9,-25],fE:[2,-16],fH:[6,-10],bE:[-8,-12],bH:[-10,-5],bK:[-6,14],bF:[-12,30]}),
  hitMid:mk({ox:-5,hip:[-3,1],neck:[2,-17],head:[4,-22],fE:[5,-9],fH:[4,-3],bE:[0,-9],bH:[3,-4],fK:[6,14],fF:[11,30],bK:[-7,14],bF:[-12,30]}),
  hitLow:mk({ox:-3,hip:[-1,4],neck:[-1,-17],head:[0,-23],fK:[5,17],fF:[10,30],bK:[-6,16],bF:[-11,30],fE:[6,-9],fH:[11,-12],bE:[-6,-9],bH:[-10,-5]}),
  win:mk({neck:[1,-22],head:[1,-28],fE:[6,-15],fH:[4,-8],bE:[-4,-15],bH:[-2,-8]})
};
const CAP={high:'High',mid:'Mid',low:'Low'};

/* ---------- pixel drawing ---------- */
function seg(a,b,w,c){const dx=b[0]-a[0],dy=b[1]-a[1],n=Math.max(1,Math.ceil(Math.hypot(dx,dy)*1.5));ctx.fillStyle=c;
  for(let i=0;i<=n;i++){const t=i/n;ctx.fillRect(Math.round(a[0]+dx*t-w/2),Math.round(a[1]+dy*t-w/2),w,w)}}
function chain(pts,ws,c){for(let i=0;i<ws.length;i++)seg(pts[i],pts[i+1],ws[i]+2,OUT);for(let i=0;i<ws.length;i++)seg(pts[i],pts[i+1],ws[i],c)}
function dot(p,s,c){ctx.fillStyle=OUT;ctx.fillRect(Math.round(p[0]-s/2)-1,Math.round(p[1]-s/2)-1,s+2,s+2);ctx.fillStyle=c;ctx.fillRect(Math.round(p[0]-s/2),Math.round(p[1]-s/2),s,s)}
function drawHead(c,f){const cx=Math.round(c[0]),cy=Math.round(c[1]),dir=f.dir;
  for(let y=-5;y<=5;y++)for(let x=-5;x<=5;x++)if(x*x+y*y<=24){ctx.fillStyle=OUT;ctx.fillRect(cx+x,cy+y,1,1)}
  for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++)if(x*x+y*y<=17){
    const hairPx=f.glasses?(y<=-3||(dir*x<=-2&&y<=0)):(y<=-2||(dir*x<=-1&&y<=1));
    ctx.fillStyle=hairPx?f.hair:f.skin;ctx.fillRect(cx+x,cy+y,1,1)}
  ctx.fillStyle=OUT;
  if(f.glasses){ctx.fillRect(cx+dir*1,cy-1,dir>0?3:-3,1);ctx.fillRect(cx+dir*3,cy-1,1,2);ctx.fillRect(cx+dir*2,cy+3,dir>0?2:-2,1)}
  else ctx.fillRect(cx+dir*2,cy-1,1,1);
}
function drawFighter(f){
  const p=cur(f),bob=f.name==='stance'?Math.round(Math.sin(gt/320+f.bx)*0.7):0;

  const hip=W('hip'),neck=W('neck'),head=W('head'),sh=[neck[0],neck[1]+2];
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(Math.round(hip[0])-11,GROUND-1,22,2);
  chain([hip,W('bK'),W('bF')],[5,4],GI_S);dot(W('bF'),2,f.skin);
  chain([sh,W('bE'),W('bH')],[4,3],GI_S);dot(W('bH'),3,f.skin);
  seg(neck,head,3,f.skin);
  chain([hip,neck],[8],GI);
  seg([neck[0]+f.dir*2,neck[1]+1],[hip[0]+f.dir*1,hip[1]-7],1,GI_S);
  ctx.fillStyle=f.belt===GI?'#ddd':f.belt;
  ctx.fillStyle=OUT;ctx.fillRect(Math.round(hip[0])-5,Math.round(hip[1])-3,11,4);
  ctx.fillStyle=f.belt;ctx.fillRect(Math.round(hip[0])-4,Math.round(hip[1])-2,9,2);
  ctx.fillRect(Math.round(hip[0]+f.dir*2),Math.round(hip[1]),1,4);ctx.fillRect(Math.round(hip[0]+f.dir*3),Math.round(hip[1]),1,3);
  chain([hip,W('fK'),W('fF')],[5,4],GI);dot(W('fF'),2,f.skin);
  chain([sh,W('fE'),W('fH')],[4,3],GI);dot(W('fH'),3,f.skin);

}

let shake=0,flash=0,parts=[],sparks=[],trail=[],trailOn=null;
function boom(x,y,big,dirx){

    parts.push({x,y,vx:Math.cos(a)*s+dirx*.05,vy:Math.sin(a)*s-.05,t0:gt,life:300+Math.random()*250,c:Math.random()<.5?'#fff3d1':'#f2c15a'})}
  buzz(big?45:20);
}
function drawFx(){
  for(const s of sparks){const k=(gt-s.t0)/s.life;if(k>1)continue;const r1=2+k*(s.big?7:4),r2=r1+(s.big?6:3)*(1-k);
    ctx.fillStyle=k<.4?'#ffffff':'#ffe08a';
    for(let i=0;i<8;i++){const a=i*Math.PI/4+(s.big?0.2:0);for(let r=r1;r<r2;r+=.7)ctx.fillRect(Math.round(s.x+Math.cos(a)*r),Math.round(s.y+Math.sin(a)*r),1,1)}

  sparks=sparks.filter(s=>gt-s.t0<s.life);
  for(const p of parts){const t=gt-p.t0;if(t>p.life)continue;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x+p.vx*t),Math.round(p.y+p.vy*t+.00025*t*t),1,1)}

}

  const c=chaining;prevL=l;
  const su=Math.round(STARTUP[l]*(c?.6:1));
  setPose(me,'ch'+CAP[l],Math.round(su*.7));
  if(oBlock)at(Math.max(40,su-60),()=>setPose(kai,'bl'+CAP[l],50));
  at(su,()=>{setPose(me,'st'+CAP[l],60);sfx.whoosh();trail=[];trailOn={f:me,k:l==='mid'?'bH':'fF'}});
  at(su+70,()=>pResolve(l,open,same,c));
}
function intercept(l){
  phase='recover';front=kai;setMode('busy');buffered=null;
  setPose(me,'ch'+CAP[l],80);
  setPose(kai,'stMid',60);sfx.whoosh();
  at(70,()=>{
    const ix=me.bx+TARGET.mid[0],iy=BY+TARGET.mid[1];
    setPose(me,'hitMid',FX?40:70);sfx.thump();boom(ix,iy,true,-1);
    const d=Math.round(DMG.mid*1.4);pHP=Math.max(0,pHP-d);rally=0;hud();
    showStamp('被迎擊','−'+d+' · 亂打被看穿',30,'hurt');setCue('');
    at(420,()=>setPose(kai,'stance',220));
    at(850,()=>{lastAtkEnd=-9999;if(!end())neutral()});
  });
}
function pResolve(l,open,same,chained){
  trailOn=null;lastAtkEnd=gt;
  const tp=TARGET[l],ix=kai.bx-tp[0],iy=BY+tp[1];
  if(oBlock){
    rally++;bestRally=Math.max(bestRally,rally);hud();
    sfx.clack();sfx.ding(rally);boom(ix-2,iy,false,1);
    if(chainCount<2){
      chainCount++;phase='pChain';setMode('open');
      if(buffered){const nb=buffered;buffered=null;setCue('連段 '+(chainCount+1)+'！','open');playerAttack(nb);return}
      setCue(same>=2&&!chained?'被看穿了！換一招連下去':'被擋！馬上換一招連下去','open');
      const tok=++chainTok;
      at(LT()?700:340,()=>{if(phase==='pChain'&&tok===chainTok){setPose(me,'stance',120);if(LT()){setPose(kai,'stance',150);setCue('太慢了，被擋下要馬上接下一招','danger');at(500,()=>neutral())}else oppAttack(true)}});
    }else{
      buffered=null;setCue('連段被擋光了！他要反擊','danger');
      at(140,()=>setPose(me,'stance',160));
      at(180,()=>oppAttack(true));
    }
  }else{
    setPose(kai,'hit'+CAP[l],FX?40:70);sfx.thump();
    boom(ix,iy,true,1);
    const mult=(chained?1+.25*chainCount:1)*(open?1.3:1)*(rally>=4?1.15:1);
    const d=Math.round(DMG[l]*mult);oHP=Math.max(0,oHP-d);const r=rally;rally=0;hud();
    const lt=LT();
    if(lt){oHP=100;hud();buffered=null;
      let ok=false,msg='';
      if(lt.goal==='each'){if(!tut.hit[l]){tut.hit[l]=1;ok=true}else msg='這招打過了，換閃的那一招'}
      else if(lt.goal==='open'){ok=open;msg='要在擋下師範的招後、按鈕發亮時出手'}
      else if(lt.goal==='chain'){ok=chained;msg='要先被擋一招，再馬上接另一個高度'}
      else if(lt.goal==='snatch'){msg='這課要在師範起腳時搶先出中段拳'}
      showStamp('有效',ok?(lt.goal==='chain'?'連段成功':lt.goal==='open'?'抓到空檔':NAME[l]):'',70,'good');
      setCue(ok?'很好！':msg,ok?'open':'danger');
      at(500,()=>setPose(kai,'stance',220));
      if(ok)at(700,()=>tutPass());else at(1100,()=>neutral());
      return}
    buffered=null;showStamp('有效','−'+d+(chained?' · '+(chainCount+1)+' 連段':r>=2?' · '+r+' 來回':(open?' · 抓到空檔':'')),70,'good');
    setCue('');
    at(750,()=>{if(!end())neutral()});
  }
}
/* --- opponent attacks: feints and combos --- */
function pickLevel(not){let l;do{l=LV[Math.random()*3|0]}while(l===not||(oHist.length>=2&&oHist[oHist.length-1]===l&&oHist[oHist.length-2]===l));oHist.push(l);return l}
function oppAttack(isCounter,comboLeft,quick){
  snatch=null;if(FX)sparks.push({x:kai.bx-4,y:BY-28,t0:gt,life:110,big:false});
  phase='oWind';choice=null;t0=gt;front=kai;setMode('defend');chainCount=0;
  const stage=Math.min(5,Math.floor((200-pHP-oHP)/35));
  if(comboLeft==null){const r=Math.random();oCombo=r<(.12+stage*.03)*D.combo?2:r<(.38+stage*.04)*D.combo?1:0}else oCombo=comboLeft;
  oLevel=pickLevel(quick?oLevel:null);
  const lt=LT();
  if(lt){if(comboLeft==null)oCombo=lt.combo||0;if(lt.lv)oLevel=lt.lv}
  const win=lt?(lt.kai==='slow'?1400:quick?600:lt.hint?1050:850):quick?Math.max(380,520-rally*12):isCounter?Math.max(420,640-rally*20):Math.max(480,760-stage*40);
  feint=null;
  if(!quick&&(lt?!!lt.feint:Math.random()<D.feint+stage*.05)){
    feint=pickLevel(oLevel);oHist.pop();
    const sw=gt+win*.45;
    setPose(kai,'ch'+CAP[feint],isCounter?80:110);
    at(win*.45,()=>{if(phase==='oWind'){setPose(kai,'ch'+CAP[oLevel],55);if(lt){setCue('換招了！'+(tut.hintNext?POSECUE[oLevel]:'改按正確的防守'),'danger');if(tut.hintNext)showHint(oLevel)}}});
    realAt=sw;strikeAt=sw+Math.max(360,win*.62);
  }else{
    setPose(kai,'ch'+CAP[oLevel],quick?60:isCounter?80:110);
    realAt=gt;strikeAt=gt+win;
  }
  setCue(quick?'連段！還有下一招':isCounter?'他反擊了！看動作擋住':'師範出招了！','danger');
  if(lt&&lt.goal==='snatch'){setCue('現在！搶先出「中段拳」','danger');showHint('mid','atk');return}
  if(lt){const st=lt,show=st.hint||tut.hintNext;
    if(feint)setCue('注意，可能是假動作！','danger');
    else if(show){setCue((quick?'下一招！':'')+POSECUE[oLevel],'danger');showHint(oLevel)}
    else if(quick)setCue('連段！還有下一招','danger');}
}
function playerBlock(l){
  if(phase!=='oWind'||snatch)return;
  if(choice===l)return;
  choice=l;pressAt=gt;
  setPose(me,'bl'+CAP[l],FX?50:65);
  flashPad('def',l,'on');
}
function oStrike(){phase='oStrike';setPose(kai,'st'+CAP[oLevel],70);sfx.whoosh();trail=[];trailOn={f:kai,k:oLevel==='mid'?'bH':'fF'};impactAt=gt+70}
function oResolve(){
  trailOn=null;
  const tp=TARGET[oLevel],ix=me.bx+tp[0],iy=BY+tp[1];
  if(choice===oLevel){
    times.push(Math.max(0,pressAt-realAt));stam=Math.min(100,stam+12);
    flashPad('def',oLevel,'good');
    rally++;bestRally=Math.max(bestRally,rally);hud();
    sfx.clack();sfx.ding(rally);boom(ix+2,iy,false,-1);
    if(oCombo>0){
      phase='recover';
      at(90,()=>oppAttack(true,oCombo-1,true));
      return;
    }
    const lt=LT();
    if(lt&&lt.goal==='open'){clearHint();tut.hintNext=false;openUntil=gt+900;phase='recover';at(100,()=>{setPose(kai,'stance',260);neutral(2600);setMode('open');setCue('空檔！馬上打回去','open')});return}
    if(lt&&lt.goal==='snatch'){clearHint();phase='recover';setCue('擋住了，但這課要搶先出手','danger');at(200,()=>setPose(kai,'stance',240));at(900,()=>neutral());return}
    if(lt){clearHint();phase='recover';tut.hintNext=false;setCue(feint?'沒被騙到！':'擋住了！','open');at(200,()=>setPose(kai,'stance',240));tutPass();return}
    openUntil=gt+(100+Math.max(330,540-rally*18))*D.open;
    phase='recover';
    at(100,()=>{setPose(kai,'stance',260);neutral(openUntil-gt+500+Math.random()*500);setMode('open');setCue(feint?'沒被騙到！空檔，快打回去！':'擋住了！空檔，快打回去！','open')});
  }else{
    if(choice)flashPad('def',choice,'bad');
    setPose(me,'hit'+CAP[oLevel],FX?40:70);sfx.thump();
    boom(ix,iy,true,-1);
    if(LT()){clearHint();tut.hintNext=true;tut.fail=false;phase='recover';setMode('busy');
      const ans={high:'上防守',mid:'中防守',low:'下防守'}[oLevel];
      showStamp('被擊中',feint&&choice===feint?'被假動作騙了':choice?'防錯位置':'太慢了',30,'hurt');
      setCue('這招要按「'+ans+'」，再來一次','danger');
      at(420,()=>setPose(kai,'stance',220));at(1300,()=>neutral(900));return}
    const d=Math.round(DMG[oLevel]*(snatch?1.3:1)*(rally>=4?1.15:1));pHP=Math.max(0,pHP-d);rally=0;hud();
    const why=snatch?'搶攻太慢':feint&&choice===feint?'被假動作騙了':choice?'防錯位置':'太慢了';snatch=null;
    showStamp('被擊中','−'+d+' · '+why,30,'hurt');
    setCue('');phase='recover';setMode('busy');
    at(420,()=>setPose(kai,'stance',220));
    at(800,()=>{if(!end())neutral()});
  }
}
function end(){
  if(pHP>0&&oHP>0)return false;
  if(tut&&TUT[tut.i]&&TUT[tut.i].bout){
    if(oHP<=0){tut.i++;tut.count=0;phase='recover';setPose(me,'win',300);showStamp('過關','教學完成',50,'good');at(1000,()=>{phase='end';$('lesson').hidden=true;pads.classList.remove('tutorial');setCue('');$('tdTitle').textContent='攻擊教學完成';$('tdText').textContent='出手、抓空檔、連段、搶攻都學會了。上實戰試試，記得別亂打。';$('tutDone').hidden=false;tut=null});return true}
    pHP=100;oHP=40;hud();setCue('沒關係，體力補滿再來一次','danger');return false}
  phase='end';setCue('');setMode('busy');
  const won=oHP<=0;
  if(won)setPose(me,'win',300);else setPose(kai,'win',300);
  $('rTitle').textContent=(won?'你贏了！':'師範勝')+'｜'+D.name;
  if(won&&diffKey+1>cleared){cleared=diffKey+1;try{localStorage.setItem('fk_cleared',cleared)}catch(e){}}
  const nb=$('nextLv');nb.hidden=!(won&&diffKey<LEVELS.length-1);if(!nb.hidden)nb.textContent='挑戰'+LEVELS[diffKey+1].name;
  $('rScore').textContent=Math.round(pHP);$('rBest').textContent=bestRally;
  $('rAvg').textContent=times.length?(times.reduce((a,b)=>a+b,0)/times.length/1000/SPEED).toFixed(2)+'s':'–';
  setTimeout(()=>{$('result').hidden=false},700);
  return true;
}
function update(){
  timers.sort((a,b)=>a.t-b.t);
  while(timers.length&&timers[0].t<=gt)timers.shift().fn();
  if(phase!=='pAtk'&&phase!=='pChain'&&phase!=='menu'&&phase!=='end'){const nd=gt-(update.l||gt);stam=Math.min(100,stam+nd*.02);hudSt()}
  update.l=gt;
  if(phase==='neutral'){
    if(pads.dataset.mode==='open'&&gt>openUntil){setMode('attack');setCue('空檔過了，再找機會')}
    if(gt>=pressureAt)oppAttack(false);
  }
  else if(phase==='oWind'&&gt>=strikeAt)oStrike();
  else if(phase==='oStrike'&&gt>=impactAt)oResolve();
}

/* ---------- loop ---------- */
function frame(now){
  const dt=Math.min(50,now-last);last=now;
  if(freeze>0)freeze-=dt;else{gt+=dt*SPEED;update()}
  shake*=Math.exp(-dt/75);flash*=Math.exp(-dt/60);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,150,112);
  const sx=shake>.3?Math.round((Math.random()*2-1)*shake):0,sy=shake>.3?Math.round((Math.random()*2-1)*shake):0;
  ctx.setTransform(1,0,0,1,sx-CAMX,sy-CAMY);
  ctx.fillStyle='#2c2017';ctx.fillRect(-4,-OFFY-4,208,OFFY+8);ctx.fillStyle='#1d140d';ctx.fillRect(-4,-OFFY+6,208,3);
  ctx.drawImage(bg,-4,-4);ctx.fillStyle='#5a3c23';ctx.fillRect(-4,124,208,40);ctx.fillStyle='#4a3019';for(let y=126;y<160;y+=5)ctx.fillRect(-4,y,208,1);
  if(phase==='neutral'&&gt<openUntil&&FX&&Math.floor(gt/90)%2===0){
    ctx.fillStyle='rgba(255,224,138,.25)';ctx.fillRect(kai.bx-14,BY-34,28,64);
  }
  const back=front===me?kai:me;
  const Wb=drawFighter(back),Wf=drawFighter(front);
  if(trailOn&&FX&&freeze<=0){const W=trailOn.f===front?Wf:Wb;trail.push(W(trailOn.k));if(trail.length>6)trail.shift()}
  if(!trailOn&&trail.length&&freeze<=0)trail.shift();
  drawFx();
  if(flash>.02){ctx.globalAlpha=flash;ctx.fillStyle='#fff';ctx.fillRect(-4,-OFFY-4,208,160);ctx.globalAlpha=1}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- input ---------- */
function act(a,l){if(a==='atk')playerAttack(l);else playerBlock(l)}
padEls.forEach(b=>{
  b.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();b.classList.add('on');act(b.dataset.a,b.dataset.l)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('on')));
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act(b.dataset.a,b.dataset.l)}});
});
document.addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  const m={a:['atk','high'],s:['atk','mid'],d:['atk','low'],ArrowUp:['def','high'],ArrowLeft:['def','mid'],ArrowRight:['def','mid'],ArrowDown:['def','low']}[k];
  if(m&&!e.repeat){e.preventDefault();act(m[0],m[1]);flashPad(m[0],m[1],'on')}
});
function renderBelts(){const box=$('belts');box.innerHTML='';LEVELS.forEach((L,i)=>{const b=document.createElement('button');b.className='belt'+(i<cleared?' done':'');b.innerHTML='<i></i><span></span><small></small>';b.querySelector('i').style.background=L.color;b.querySelector('span').textContent=L.name;b.querySelector('small').textContent=i<cleared?'已過關':i===cleared?'挑戰中':'';b.addEventListener('click',()=>startGame(i));box.append(b)})}
renderBelts();
document.querySelectorAll('.diff').forEach(b=>b.addEventListener('click',()=>{$('tutDone').hidden=true;startGame(b.dataset.d)}));
$('tutToMenu').addEventListener('click',()=>{$('tutDone').hidden=true;renderBelts();$('menu').hidden=false});
$('nextLv').addEventListener('click',()=>startGame(Math.min(LEVELS.length-1,diffKey+1)));
$('tutBtn').addEventListener('click',()=>startTutorial('def'));$('tutAtkBtn').addEventListener('click',()=>startTutorial('atk'));$('tutAgain').addEventListener('click',()=>startTutorial());$('lQuit').addEventListener('click',quitTutorial);
$('toMenu').addEventListener('click',()=>{$('result').hidden=true;renderBelts();$('menu').hidden=false});
$('again').addEventListener('click',()=>startGame(diffKey));
hud();
})();
</script>
