<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>試玩回饋</title>
<style>
:root{--bg:#17120f;--panel:#231b15;--line:#3b2f25;--fg:#f2e9dd;--muted:#a89684;--accent:#e6ac4c;--hit:#d9483b;--ok:#8fc4b0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:24px;letter-spacing:.06em}
.sub{margin:0;color:var(--muted);font-size:13px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.box span{display:block;font-size:12px;color:var(--muted)}
.box b{font-size:22px;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar i{display:block;height:10px;border-radius:3px;background:var(--accent)}
.bar em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.tag{padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.tag.hard{border-color:var(--hit);color:#ffb4a8}.tag.easy{border-color:var(--ok);color:var(--ok)}.tag.ok{border-color:var(--accent);color:var(--accent)}
.msg{font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.err{color:#ffb4a8}
button{background:var(--accent);color:#2a1d10;border:0;border-radius:6px;padding:8px 16px;font-weight:900;cursor:pointer;justify-self:start}
</style>
</head>
<body>
<div class="wrap">
  <h1>自由組手 試玩回饋</h1>
  <p class="sub" id="st">讀取中…</p>
  <div class="sum" id="sum"></div>
  <div class="box"><span>難度感受</span><div class="bars" id="bars"></div></div>
  <button id="reload">重新整理</button>
  <div class="list" id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const key=new URLSearchParams(location.search).get('key')||'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
  $('st').textContent='讀取中…';
  try{
    const r=await fetch('/api/feedback?key='+encodeURIComponent(key),{cache:'no-store'});
    if(r.status===403){$('st').innerHTML='<span class="err">網址裡的密鑰不對，請用 Claude 給你的完整連結。</span>';return}
    const d=await r.json();render(d);
  }catch(e){$('st').innerHTML='<span class="err">讀取失敗，請稍後再試。</span>'}
}
function render(d){
  const n=d.length,fun=d.filter(x=>x.fun).map(x=>x.fun),avg=fun.length?(fun.reduce((a,b)=>a+b,0)/fun.length).toFixed(1):'–';
  const cnt={easy:0,ok:0,hard:0};d.forEach(x=>{if(cnt[x.diff]!=null)cnt[x.diff]++});
  const winRate=n?Math.round(d.filter(x=>x.won).length/n*100)+'%':'–';
  $('st').textContent='共 '+n+' 則回饋，最新在最上面。';
  $('sum').innerHTML=[['回饋數',n],['平均好玩程度',avg+' / 5'],['回饋時打贏的比例',winRate]].map(([a,b])=>'<div class="box"><span>'+a+'</span><b>'+b+'</b></div>').join('');
  const tot=Math.max(1,cnt.easy+cnt.ok+cnt.hard);
  $('bars').innerHTML=[['太簡單','easy'],['剛好','ok'],['太難','hard']].map(([l,k])=>'<div class="bar"><span>'+l+'</span><i style="width:'+(cnt[k]/tot*100)+'%"></i><em>'+cnt[k]+'</em></div>').join('');
  const L={easy:'太簡單',ok:'剛好',hard:'太難'};
  $('list').innerHTML=d.map(x=>'<div class="item"><div class="meta">'+
    '<span>'+esc(new Date(x.t).toLocaleString('zh-TW',{hour12:false}))+'</span>'+
    (x.name?'<span class="tag">'+esc(x.name)+'</span>':'')+
    (x.diff?'<span class="tag '+esc(x.diff)+'">'+esc(L[x.diff]||x.diff)+'</span>':'')+
    (x.fun?'<span class="tag">好玩 '+'★'.repeat(x.fun)+'</span>':'')+
    (x.opp?'<span class="tag">對手：'+esc(x.opp)+(x.won?'（贏）':'（輸）')+'</span>':'')+
    (x.hero?'<span class="tag">'+(x.hero==='f'?'女主角':'男主角')+'</span>':'')+
    '</div>'+(x.msg?'<div class="msg">'+esc(x.msg)+'</div>':'')+'</div>').join('');
}
$('reload').addEventListener('click',load);load();
</script>
</body>
</html>
